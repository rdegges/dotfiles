<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tipsy — tip calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Tipsy</h1>
    <p class="tagline">Split the bill. Keep your friends.</p>

    <div class="card">
      <label for="bill">Bill amount ($)</label>
      <input id="bill" type="number" step="0.01" placeholder="86.40" />

      <label for="percent">Tip (%)</label>
      <input id="percent" type="number" value="20" />

      <label for="split">Split between</label>
      <input id="split" type="number" value="1" />

      <button id="calc">Calculate</button>
    </div>

    <section id="result" class="result" hidden>
      <div class="row"><span>Tip</span><span class="result-value" id="tip"></span></div>
      <div class="row"><span>Total</span><span class="result-value" id="total"></span></div>
      <div class="row big"><span>Each person pays</span><span class="result-value" id="per-person"></span></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
